# Publishes the extension to the Visual Studio Marketplace and Open VSX with trusted publishing,
# waits for both to list the new version, tags the released commit, and creates a GitHub release
# from the version's CHANGELOG.md section.
#
# post-merge.yml starts this workflow on main after CI passes on a push to main whose
# package.json version has no tag yet. The check-version job runs only when started by
# github-actions[bot], and requires the given post-merge.yml run to be a push to main for the
# commit whose ci-gate job passed. It repeats the tag check because an earlier queued run may have
# released the version already.
#
# The filename and the `release` environment are registered as a trusted publisher on the Visual
# Studio Marketplace and on Open VSX. Renaming either breaks publishing until both registrations
# are recreated.
#
# If a run fails after a publish job started, use "Re-run failed jobs". Both publish steps skip a
# version that already exists, and the build job rejects a version that is already published.
name: release

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full SHA of a commit on main that passed CI
        required: true
        type: string
      post-merge-run-id:
        description: ID of the post-merge.yml run for the commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  EXTENSION_ID: smithy.smithy-vscode-extension
  COMMIT: ${{ inputs.commit }}
  POST_MERGE_RUN_ID: ${{ inputs.post-merge-run-id }}

jobs:
  check-version:
    name: Check for an unreleased version
    if: github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - name: Require CI to have passed in post-merge.yml for the commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::commit must be a full 40-character SHA, got '$COMMIT'"
            exit 1
          fi
          if [[ ! "$POST_MERGE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::post-merge-run-id must be a run ID, got '$POST_MERGE_RUN_ID'"
            exit 1
          fi
          RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$POST_MERGE_RUN_ID" --jq '[.path, .event, .head_branch, .head_sha] | join(" ")')
          if [ "$RUN" != ".github/workflows/post-merge.yml push main $COMMIT" ]; then
            echo "::error::Run $POST_MERGE_RUN_ID must be a post-merge.yml push to main for $COMMIT, got '$RUN'"
            exit 1
          fi
          GATE=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$POST_MERGE_RUN_ID/jobs?per_page=100" --jq '[.jobs[] | select(.name == "ci / ci-gate") | .conclusion] | join(" ")')
          if [ "$GATE" != "success" ]; then
            echo "::error::ci / ci-gate in run $POST_MERGE_RUN_ID must have passed, got '$GATE'"
            exit 1
          fi
          echo "Run $POST_MERGE_RUN_ID passed CI for $COMMIT"

      - name: Check whether the commit's version is untagged
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(gh api -H "Accept: application/vnd.github.raw+json" "repos/$GITHUB_REPOSITORY/contents/package.json?ref=$COMMIT" | jq -r .version)
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" > /dev/null 2>&1; then
            echo "Tag $VERSION already exists, skipping release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "$VERSION has no tag, releasing $COMMIT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build
    needs: check-version
    if: needs.check-version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      notes: ${{ steps.notes.outputs.notes }}
      vsix: ${{ steps.package.outputs.vsix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
          persist-credentials: false

      - name: Read version
        id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Read release notes from CHANGELOG.md
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          NOTES=$(awk -v heading="## $VERSION (" '
            /^## / { if (found || index($0, heading) != 1) exit; found = 1; next }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            echo "::error::CHANGELOG.md's first section must be a '## $VERSION (YYYY-MM-DD)' heading with entries"
            exit 1
          fi
          {
            echo "notes<<EOF_RELEASE_NOTES"
            echo "$NOTES"
            echo "EOF_RELEASE_NOTES"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require version to be unpublished
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          MARKETPLACE=$(npx --no-install vsce show "$EXTENSION_ID" --json)
          if jq -e --arg v "$VERSION" 'any(.versions[]; .version == $v)' <<< "$MARKETPLACE" > /dev/null; then
            echo "::error::$VERSION is already on the Visual Studio Marketplace. If an earlier release run failed after publishing, use \"Re-run failed jobs\" on that run."
            exit 1
          fi
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' "https://open-vsx.org/api/smithy/smithy-vscode-extension/$VERSION")
          if [ "$STATUS" != "404" ]; then
            echo "::error::Expected 404 for $VERSION on Open VSX, got $STATUS. If an earlier release run failed after publishing, use \"Re-run failed jobs\" on that run."
            exit 1
          fi

      - name: Package extension
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          VSIX="smithy-vscode-extension-$VERSION.vsix"
          npx --no-install vsce package --out "$VSIX"
          echo "vsix=$VSIX" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix
          path: ${{ steps.package.outputs.vsix }}
          if-no-files-found: error

  publish-marketplace:
    name: Publish to Visual Studio Marketplace
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: release
      url: https://marketplace.visualstudio.com/items?itemName=smithy.smithy-vscode-extension
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      VSIX: ${{ needs.build.outputs.vsix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix

      - name: Publish
        run: npx --no-install vsce publish --oidc --packagePath "$VSIX" --skip-duplicate

      - name: Wait for version on the Marketplace
        run: |
          for _ in $(seq 1 40); do
            if npx --no-install vsce show "$EXTENSION_ID" --json | jq -e --arg v "$VERSION" 'any(.versions[]; .version == $v)' > /dev/null; then
              echo "$VERSION is on the Visual Studio Marketplace"
              exit 0
            fi
            echo "$VERSION is not on the Visual Studio Marketplace yet, retrying in 15 seconds"
            sleep 15
          done
          echo "::error::$VERSION did not appear on the Visual Studio Marketplace within 10 minutes"
          exit 1

      # The Marketplace serves the uploaded .vsix gzip-compressed. `gzip -cdf` also passes through
      # an uncompressed download.
      - name: Compare Marketplace download with the packaged extension
        run: |
          URL="https://marketplace.visualstudio.com/_apis/public/gallery/publishers/smithy/vsextensions/smithy-vscode-extension/$VERSION/vspackage"
          curl -sSfL -o marketplace.download "$URL"
          EXPECTED=$(sha256sum "$VSIX" | cut -d ' ' -f 1)
          ACTUAL=$(gzip -cdf marketplace.download | sha256sum | cut -d ' ' -f 1)
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::The Marketplace serves sha256 $ACTUAL, expected $EXPECTED"
            exit 1
          fi
          echo "The Marketplace serves the packaged extension (sha256 $ACTUAL)"

  publish-open-vsx:
    name: Publish to Open VSX
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: release
      url: https://open-vsx.org/extension/smithy/smithy-vscode-extension/${{ needs.build.outputs.version }}
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      VSIX: ${{ needs.build.outputs.vsix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix

      - name: Publish
        run: npx --no-install ovsx publish --packagePath "$VSIX" --trusted-publishing --skip-duplicate

      - name: Wait for version on Open VSX
        run: |
          URL="https://open-vsx.org/api/smithy/smithy-vscode-extension/$VERSION"
          for _ in $(seq 1 40); do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' "$URL")
            if [ "$STATUS" = "200" ]; then
              echo "$URL returned 200"
              exit 0
            fi
            echo "$URL returned $STATUS, retrying in 15 seconds"
            sleep 15
          done
          echo "::error::$VERSION did not appear on Open VSX within 10 minutes"
          exit 1

      - name: Compare Open VSX download with the packaged extension
        run: |
          URL="https://open-vsx.org/api/smithy/smithy-vscode-extension/$VERSION/file/$EXTENSION_ID-$VERSION.vsix"
          curl -sSfL -o open-vsx.vsix "$URL"
          EXPECTED=$(sha256sum "$VSIX" | cut -d ' ' -f 1)
          ACTUAL=$(sha256sum open-vsx.vsix | cut -d ' ' -f 1)
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Open VSX serves sha256 $ACTUAL, expected $EXPECTED"
            exit 1
          fi
          echo "Open VSX serves the packaged extension (sha256 $ACTUAL)"

  tag:
    name: Tag and create GitHub release
    needs: [build, publish-marketplace, publish-open-vsx]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Push tag
        run: |
          if ! TAG_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" --jq .object.sha 2> /dev/null); then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$VERSION" -f sha="$COMMIT" > /dev/null
            TAG_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" --jq .object.sha)
          fi
          if [ "$TAG_SHA" != "$COMMIT" ]; then
            echo "::error::Tag $VERSION points to $TAG_SHA, expected $COMMIT"
            exit 1
          fi
          echo "Tag $VERSION points to $COMMIT"

      - name: Create GitHub release
        env:
          NOTES: ${{ needs.build.outputs.notes }}
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "GitHub release $VERSION already exists"
            exit 0
          fi
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$VERSION" --notes "$NOTES"

      - name: Write job summary
        run: |
          {
            echo "## Released $VERSION"
            echo
            echo "- Version: \`$VERSION\`"
            echo "- Commit: [\`$COMMIT\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$COMMIT)"
            echo "- GitHub release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$VERSION"
            echo "- Visual Studio Marketplace: https://marketplace.visualstudio.com/items?itemName=$EXTENSION_ID"
            echo "- Open VSX: https://open-vsx.org/extension/smithy/smithy-vscode-extension/$VERSION"
          } >> "$GITHUB_STEP_SUMMARY"
