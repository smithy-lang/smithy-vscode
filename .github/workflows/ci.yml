name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-extension:
    runs-on: ubuntu-latest
    name: Test Textmate syntax and extension (VS Code ${{ matrix.vscode-version }})
    strategy:
      fail-fast: false
      matrix:
        # The minimum supported version (engines.vscode in package.json) and the latest Stable release.
        vscode-version: ["1.114.0", "stable"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        # dbus-run-session provides a session bus so Electron doesn't log dbus connection errors.
        run: dbus-run-session -- xvfb-run -a npm test
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode-version }}
