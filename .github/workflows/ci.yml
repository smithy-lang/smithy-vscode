name: ci

# Runs on pull requests. post-merge.yml calls this workflow on pushes to main.
on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: Check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      # post-merge.yml starts a release for a push to main whose version is untagged, so check here
      # that the release won't fail on the version's CHANGELOG.md section.
      - name: Check CHANGELOG.md for an unreleased version
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(jq -r .version package.json)
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" > /dev/null 2>&1; then
            echo "Version $VERSION is already released"
            exit 0
          fi
          NOTES=$(awk -v heading="## $VERSION (" '
            /^## / { if (found || index($0, heading) != 1) exit; found = 1; next }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            echo "::error::CHANGELOG.md's first section must be a '## $VERSION (YYYY-MM-DD)' heading with entries"
            exit 1
          fi
          echo "CHANGELOG.md has entries for unreleased version $VERSION"

  # Resolve the versions of everything the tests download, so each cache key changes when the
  # version it caches changes:
  # - @vscode/test-electron downloads VS Code into .vscode-test/vscode-<platform>-<version>,
  #   where <platform> is linux-x64, darwin-arm64, or win32-x64-archive.
  #   "stable" is resolved to a concrete version so a new Stable release gets a new key.
  # - The extension downloads the latest language server release into
  #   language-server/<version> in its global storage. Its version also keys the Maven cache,
  #   because a release can bundle a Maven resolver that records cached artifacts differently.
  # Resolving them once here, instead of in each test-extension job, makes fewer requests and
  # gives every job the same versions.
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: Resolve versions
    outputs:
      vscode-stable: ${{ steps.versions.outputs.vscode-stable }}
      lsp: ${{ steps.versions.outputs.lsp }}
    steps:
      - name: Resolve versions
        id: versions
        run: |
          vscode=$(curl -fsSL --retry 3 --retry-all-errors https://update.code.visualstudio.com/api/releases/stable | jq -r '.[0]')
          lsp=$(curl -fsSL --retry 3 --retry-all-errors https://github.com/smithy-lang/smithy-language-server/releases/latest/download/VERSION)
          if [ -z "$vscode" ] || [ "$vscode" = "null" ] || [ -z "$lsp" ]; then
            echo "::error::Could not resolve versions: VS Code '$vscode', language server '$lsp'"
            exit 1
          fi
          {
            echo "vscode-stable=$vscode"
            echo "lsp=$lsp"
          } >> "$GITHUB_OUTPUT"

  test-extension:
    needs: versions
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    name: Test extension (${{ matrix.os }}, VS Code ${{ matrix.vscode-version }})
    env:
      # The exact VS Code version, such as 1.142.0 instead of "stable", so the tests use the
      # VS Code install restored by "Cache VS Code download".
      VSCODE_TEST_VERSION: ${{ matrix.vscode-version == 'stable' && needs.versions.outputs.vscode-stable || matrix.vscode-version }}
      LSP_VERSION: ${{ needs.versions.outputs.lsp }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The minimum supported version (engines.vscode in package.json) and the latest Stable release.
        vscode-version: ["1.114.0", "stable"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache VS Code download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vscode-test/vscode-*-${{ env.VSCODE_TEST_VERSION }}
          key: vscode-${{ runner.os }}-${{ runner.arch }}-${{ env.VSCODE_TEST_VERSION }}

      - name: Cache language server download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vscode-test/user-data/User/globalStorage/smithy.smithy-vscode-extension/language-server/${{ env.LSP_VERSION }}
          key: language-server-${{ runner.os }}-${{ runner.arch }}-${{ env.LSP_VERSION }}

      # The language server resolves the fixtures' Maven dependencies into ~/.m2/repository.
      - name: Cache Maven dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ env.LSP_VERSION }}-${{ hashFiles('tests/*/workspace/**/smithy-build.json') }}

      - name: Run tests
        if: runner.os == 'Linux'
        # xvfb provides a display. dbus-run-session provides a session bus so Electron doesn't log
        # dbus connection errors. The bus config has no service directories, so dbus-daemon doesn't
        # log failed attempts to start org.freedesktop.systemd1.
        run: dbus-run-session --config-file=.github/ci/dbus-session.conf -- xvfb-run -a npm run test-extension
      - name: Run tests
        if: runner.os != 'Linux'
        run: npm run test-extension

  ci-gate:
    name: ci-gate
    needs: [check, test-extension]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all jobs to pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
