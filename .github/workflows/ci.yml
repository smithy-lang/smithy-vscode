name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: Check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

  test-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Test extension (VS Code ${{ matrix.vscode-version }})
    strategy:
      fail-fast: false
      matrix:
        # The minimum supported version (engines.vscode in package.json) and the latest Stable release.
        vscode-version: ["1.114.0", "stable"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Resolve the versions of everything the tests download, so each cache key changes when the
      # version it caches changes:
      # - @vscode/test-electron downloads VS Code into .vscode-test/vscode-<platform>-<version>.
      #   "stable" is resolved to a concrete version so a new Stable release gets a new key.
      # - The extension downloads the latest language server release into
      #   language-server/<version> in its global storage.
      - name: Resolve versions
        id: versions
        env:
          VSCODE_VERSION: ${{ matrix.vscode-version }}
        run: |
          vscode="$VSCODE_VERSION"
          if [ "$vscode" = "stable" ]; then
            vscode=$(curl -fsSL --retry 3 https://update.code.visualstudio.com/api/releases/stable | jq -r '.[0]')
          fi
          lsp=$(curl -fsSL --retry 3 https://github.com/smithy-lang/smithy-language-server/releases/latest/download/VERSION)
          if [ -z "$vscode" ] || [ "$vscode" = "null" ] || [ -z "$lsp" ]; then
            echo "::error::Could not resolve versions: VS Code '$vscode', language server '$lsp'"
            exit 1
          fi
          {
            echo "vscode=$vscode"
            echo "lsp=$lsp"
          } >> "$GITHUB_OUTPUT"

      - name: Cache VS Code download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vscode-test/vscode-linux-x64-${{ steps.versions.outputs.vscode }}
          key: vscode-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.vscode }}

      - name: Cache language server download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vscode-test/user-data/User/globalStorage/smithy.smithy-vscode-extension/language-server/${{ steps.versions.outputs.lsp }}
          key: language-server-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.lsp }}

      - name: Run tests
        # dbus-run-session provides a session bus so Electron doesn't log dbus connection errors.
        run: dbus-run-session -- xvfb-run -a npm run test-extension
        env:
          # The exact version from "Resolve versions", such as 1.142.0 instead of "stable", so the
          # tests use the VS Code install restored by "Cache VS Code download".
          VSCODE_TEST_VERSION: ${{ steps.versions.outputs.vscode }}
