name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-extension:
    runs-on: ubuntu-latest
    name: Test Textmate syntax and extension (VS Code ${{ matrix.vscode-version }})
    strategy:
      fail-fast: false
      matrix:
        # The minimum supported version (engines.vscode in package.json) and the latest Stable release.
        vscode-version: ["1.114.0", "stable"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Resolve the versions of everything the tests download, so each cache key changes when the
      # version it caches changes:
      # - @vscode/test-electron downloads VS Code into .vscode-test/vscode-<platform>-<version>.
      #   "stable" is resolved to a concrete version so a new Stable release gets a new key.
      # - The extension downloads the Coursier binary (COURSIER_VERSION in src/coursier/coursier.ts)
      #   into its global storage.
      # - Coursier downloads the JVM (COURSIER_JVM in src/extension.ts) into ~/.cache/coursier/jvm
      #   and the language server ("latest.release") into ~/.cache/coursier/v1.
      #   COURSIER_JVM, such as corretto:21, is resolved through COURSIER_JVM_INDEX to the exact JDK
      #   version Coursier picks, so a new patch release gets a new key.
      - name: Resolve versions
        id: versions
        env:
          VSCODE_VERSION: ${{ matrix.vscode-version }}
        run: |
          vscode="$VSCODE_VERSION"
          if [ "$vscode" = "stable" ]; then
            vscode=$(curl -fsSL --retry 3 https://update.code.visualstudio.com/api/releases/stable | jq -r '.[0]')
          fi
          coursier=$(sed -n "s/^const COURSIER_VERSION = '\(.*\)';$/\1/p" src/coursier/coursier.ts)
          jvm_id=$(sed -n "s/^const COURSIER_JVM = '\(.*\)';$/\1/p" src/extension.ts)
          jvm_index=$(sed -n "s/^const COURSIER_JVM_INDEX = '\(.*\)';$/\1/p" src/extension.ts)
          jvm_name=${jvm_id%%:*}
          jvm_major=${jvm_id#*:}
          jdk=""
          if [ -n "$jvm_id" ] && [ -n "$jvm_index" ]; then
            # Keys are versions such as 21.0.9.11.1. sort -V orders 21.0.10 after 21.0.9.
            jdk=$(curl -fsSL --retry 3 "$jvm_index" \
              | jq -r --arg n "jdk@$jvm_name" '.linux.amd64[$n] // {} | keys[]' \
              | grep -E "^${jvm_major}\." | sort -V | tail -n 1)
          fi
          jvm="${jvm_name}-${jdk}"
          lsp=$(curl -fsSL --retry 3 https://repo1.maven.org/maven2/software/amazon/smithy/smithy-language-server/maven-metadata.xml \
            | sed -n 's:.*<release>\(.*\)</release>.*:\1:p')
          if [ -z "$vscode" ] || [ "$vscode" = "null" ] || [ -z "$coursier" ] || [ -z "$jdk" ] || [ -z "$lsp" ]; then
            echo "::error::Could not resolve versions: VS Code '$vscode', Coursier '$coursier', JVM '$jvm_id' -> '$jdk', language server '$lsp'"
            exit 1
          fi
          {
            echo "vscode=$vscode"
            echo "coursier=$coursier"
            echo "jvm=$jvm"
            echo "lsp=$lsp"
          } >> "$GITHUB_OUTPUT"

      - name: Cache VS Code download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vscode-test/vscode-linux-x64-${{ steps.versions.outputs.vscode }}
          key: vscode-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.vscode }}

      - name: Cache Coursier binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vscode-test/user-data/User/globalStorage/smithy.smithy-vscode-extension/coursier
          key: coursier-bin-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.coursier }}

      - name: Cache Coursier JVM and language server
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/coursier
          key: coursier-cache-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.coursier }}-${{ steps.versions.outputs.jvm }}-lsp${{ steps.versions.outputs.lsp }}

      - name: Run tests
        # dbus-run-session provides a session bus so Electron doesn't log dbus connection errors.
        run: dbus-run-session -- xvfb-run -a npm test
        env:
          # The exact version from "Resolve versions", such as 1.142.0 instead of "stable", so the
          # tests use the VS Code install restored by "Cache VS Code download".
          VSCODE_TEST_VERSION: ${{ steps.versions.outputs.vscode }}
